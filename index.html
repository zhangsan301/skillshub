<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SkillLens">
<title>SkillLens · Skill 分类管理器</title>
<style>
:root{
  --bg:#f5f6f8; --panel:#ffffff; --ink:#0f172a; --ink-2:#475569; --ink-3:#94a3b8;
  --line:#e6e9ef; --line-2:#eef1f5; --accent:#0f766e; --accent-soft:#e6f4f1;
  --amber:#b45309; --danger:#dc2626; --shadow:0 1px 2px rgba(15,23,42,.06),0 8px 24px -12px rgba(15,23,42,.18);
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--ink); font-size:14px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
::selection{background:#cdece7}

/* ============ 布局 ============ */
.app{display:flex;min-height:100vh}
.side{
  width:220px;flex:0 0 220px;background:#0f172a;color:#e2e8f0;padding:20px 14px;
  display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh;
}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand-mark{
  width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#0f766e,#0891b2);
  display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px;letter-spacing:-.5px;
}
.brand-txt strong{display:block;font-size:15px;color:#fff;letter-spacing:.3px}
.brand-txt span{font-size:11px;color:#94a3b8}
.nav{display:flex;flex-direction:column;gap:3px}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:9px;background:none;border:0;
  color:#cbd5e1;font-size:13.5px;text-align:left;width:100%;transition:.15s;
}
.nav-item:hover{background:#1e293b;color:#fff}
.nav-item.active{background:#134e4a;color:#fff;box-shadow:inset 0 0 0 1px #115e59}
.nav-item .n-ico{width:18px;text-align:center;opacity:.85;font-size:14px}
.nav-item .n-badge{margin-left:auto;font-size:11px;color:#94a3b8}
.side-foot{margin-top:auto;font-size:11.5px;color:#64748b;padding:0 6px;line-height:1.7}
.main{flex:1;min-width:0;display:flex;flex-direction:column}

/* ============ 顶栏 ============ */
.topbar{
  display:flex;align-items:center;gap:12px;padding:16px 26px;border-bottom:1px solid var(--line);
  background:rgba(255,255,255,.86);backdrop-filter:blur(8px);position:sticky;top:0;z-index:20;
}
.topbar h1{font-size:16px;margin:0;font-weight:650;letter-spacing:-.2px}
.topbar .crumb{font-size:12px;color:var(--ink-3);margin-top:1px}
.top-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{
  border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 12px;font-size:13px;
  color:var(--ink-2);display:inline-flex;align-items:center;gap:6px;transition:.15s;white-space:nowrap;
}
.btn:hover{border-color:#cbd5e1;background:#fafbfc;color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#0d6a63;border-color:#0d6a63}
.btn.ghost-d{border-color:#e2e8f0;background:#0f172a;color:#e2e8f0}
.btn.ghost-d:hover{background:#1e293b}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:7px}
.btn.danger{color:var(--danger);border-color:#fecaca;background:#fef2f2}
.btn.danger:hover{background:#fee2e2}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ============ 通用 ============ */
.wrap{padding:24px 26px 60px;max-width:1320px;width:100%}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:10px;padding:15px 18px 0}
.card-h h2{font-size:14px;margin:0;font-weight:640}
.card-h .sub{font-size:12px;color:var(--ink-3)}
.card-h .sp{margin-left:auto}
.pad{padding:15px 18px 18px}
.grid{display:grid;gap:14px}
.muted{color:var(--ink-3)}
.small{font-size:12px}
.row{display:flex;align-items:center;gap:8px}
.chip{
  display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;
  background:#f1f5f9;color:var(--ink-2);border:1px solid transparent;white-space:nowrap;
}
.chip .dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.85}
.chip.click{cursor:pointer}
.chip.click:hover{border-color:#cbd5e1}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi .lab{font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.kpi .val{font-size:26px;font-weight:680;letter-spacing:-1px;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .hint{font-size:11.5px;color:var(--ink-3);margin-top:2px}
.kpi .bar-line{position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--line-2)}
.kpi .bar-line i{display:block;height:100%;background:var(--accent)}

/* 图表 */
.bars{display:flex;flex-direction:column;gap:9px}
.bar-row{display:grid;grid-template-columns:132px 1fr 46px;align-items:center;gap:10px;font-size:12.5px}
.bar-row .nm{display:flex;align-items:center;gap:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-row .nm .dot{width:8px;height:8px;border-radius:2px;flex:0 0 8px}
.track{height:9px;border-radius:6px;background:#f1f5f9;overflow:hidden}
.fill{height:100%;border-radius:6px;transition:width .4s cubic-bezier(.2,.8,.2,1)}
.bar-row .num{text-align:right;color:var(--ink-2);font-variant-numeric:tabular-nums}
.donut{display:flex;align-items:center;gap:20px}
.donut svg{width:132px;height:132px;flex:0 0 132px}
legend{display:flex;flex-direction:column;gap:6px;font-size:12px}
legend .li{display:flex;align-items:center;gap:7px}
legend .li .dot{width:8px;height:8px;border-radius:2px}
legend .li .v{margin-left:auto;color:var(--ink-2);font-variant-numeric:tabular-nums}

/* 列表 */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line-2)}
.search{flex:1;min-width:200px;display:flex;align-items:center;gap:8px;background:#f8fafc;border:1px solid var(--line);border-radius:9px;padding:7px 11px}
.search input{flex:1;border:0;background:none;outline:none;font-size:13px}
.sel{border:1px solid var(--line);border-radius:9px;padding:7px 9px;background:#fff;font-size:12.5px;color:var(--ink-2);outline:none}
.sel:focus{border-color:var(--accent)}
.skill-list{display:flex;flex-direction:column}
.skill{border-bottom:1px solid var(--line-2);padding:13px 18px;display:flex;gap:12px;transition:.12s}
.skill:hover{background:#fbfcfd}
.skill.off{opacity:.55}
.skill .ck{margin-top:3px;accent-color:var(--accent);width:15px;height:15px;flex:0 0 15px}
.skill .body{flex:1;min-width:0;cursor:pointer}
.skill .line1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.skill .name{font-weight:620;font-size:13.5px;letter-spacing:-.1px}
.skill .desc{font-size:12.5px;color:var(--ink-2);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.skill .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;font-size:11.5px;color:var(--ink-3)}
.skill .acts{display:flex;align-items:center;gap:4px;flex:0 0 auto}
.icon-btn{border:1px solid transparent;background:none;border-radius:7px;padding:4px 7px;color:var(--ink-3);font-size:13px;transition:.12s}
.icon-btn:hover{background:#f1f5f9;color:var(--ink)}
.stars{display:inline-flex;gap:1px;font-size:12px;color:#f59e0b;letter-spacing:-1px}
.empty{padding:46px 20px;text-align:center;color:var(--ink-3);font-size:13px}
.batch{display:flex;align-items:center;gap:8px;padding:9px 18px;background:#f8fafc;border-bottom:1px solid var(--line-2);flex-wrap:wrap;font-size:12.5px}

/* 表格 */
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{text-align:left;font-weight:600;color:var(--ink-3);font-size:11.5px;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tbl tr:hover td{background:#fbfcfd}
.tbl input[type=text]{width:100%;border:1px solid transparent;background:transparent;border-radius:7px;padding:5px 7px;font-size:12.5px;outline:none}
.tbl input[type=text]:focus{border-color:var(--accent);background:#fff}
.tbl input[type=color]{width:26px;height:26px;border:0;background:none;padding:0;border-radius:6px;cursor:pointer}

/* 抽屉/弹层 */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.35);opacity:0;pointer-events:none;transition:.2s;z-index:40}
.overlay.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;top:0;right:0;height:100vh;width:min(460px,94vw);background:#fff;z-index:50;
  box-shadow:-20px 0 50px -24px rgba(15,23,42,.4);transform:translateX(102%);transition:transform .24s cubic-bezier(.2,.8,.2,1);
  display:flex;flex-direction:column;
}
.sheet.on{transform:none}
.sheet-h{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:10px}
.sheet-h h3{margin:0;font-size:15px}
.sheet-h .close{margin-left:auto}
.sheet-b{padding:18px 20px 30px;overflow:auto;flex:1}
.field{margin-bottom:15px}
.field label{display:block;font-size:11.5px;color:var(--ink-3);margin-bottom:5px;letter-spacing:.2px}
.field input[type=text],.field input[type=password],.field input[type=search],.field textarea,.field select{
  width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 10px;outline:none;font-size:13px;background:#fff;
}
.field textarea{resize:vertical;min-height:78px;line-height:1.6}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field .hint{font-size:11px;color:var(--ink-3);margin-top:4px}
.path-box{display:flex;gap:6px}
.path-box input{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px !important}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini-stat{background:#f8fafc;border:1px solid var(--line-2);border-radius:10px;padding:9px 11px}
.mini-stat .k{font-size:11px;color:var(--ink-3)}
.mini-stat .v{font-size:16px;font-weight:640;margin-top:2px;font-variant-numeric:tabular-nums}
.star-pick{display:flex;gap:3px;font-size:22px;color:#e2e8f0;cursor:pointer}
.star-pick span.on{color:#f59e0b}
.switch{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-2)}
.switch input{width:16px;height:16px;accent-color:var(--accent)}

/* toast */
#toasts{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:#0f172a;color:#e6edf7;padding:9px 16px;border-radius:10px;font-size:12.5px;box-shadow:var(--shadow);animation:tin .2s ease}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* 拖放 */
.drop{border:1.5px dashed #cbd5e1;border-radius:12px;padding:26px;text-align:center;color:var(--ink-2);background:#fbfcfd;transition:.15s;cursor:pointer}
.drop:hover,.drop.hot{border-color:var(--accent);background:var(--accent-soft)}
.drop b{display:block;font-size:13px;color:var(--ink);margin-bottom:3px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px}

@media (max-width:900px){
  .app{flex-direction:column}
  .grid{grid-template-columns:1fr !important}
  .donut{flex-wrap:wrap}
  .topbar{flex-wrap:wrap;gap:8px}
  .topbar .top-actions{width:100%}
  .skill{flex-wrap:wrap}
  .skill .body{flex:1 1 calc(100% - 44px)}
  .brand{display:none}
  .howto{grid-template-columns:1fr !important}
  .brand-mark{width:26px;height:26px;font-size:12px}
  .nav-item{font-size:11.5px;padding:6px 8px;gap:6px}
  .nav-item .n-ico{display:none}
  .skill .acts{width:100%;justify-content:flex-end;border-top:1px dashed var(--line-2);padding-top:6px}
  .side{width:100%;flex:none;height:auto;position:relative;flex-direction:row;align-items:center;gap:10px;padding:10px 12px;overflow-x:auto}
  .brand{padding:0}
  .brand-txt{display:none}
  .nav{flex-direction:row;gap:4px}
  .nav-item{padding:7px 10px;font-size:12.5px;white-space:nowrap}
  .nav-item .n-badge,.side-foot{display:none}
  .wrap{padding:16px 14px 50px}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .topbar{padding:12px 14px}
  .top-actions .btn span.txt{display:none}
  .bar-row{grid-template-columns:96px 1fr 34px}
}

/* ============ 手机 App 层（≤820px） ============ */
.app-tip{display:none}
.tabbar{display:none}
.fab{display:none}
.fstrip{display:contents}
@media (max-width:820px){
  html,body{overscroll-behavior-y:contain}
  body{font-size:15px;background:#f5f6f8}
  .app{display:block}
  .side{display:none}
  .main{display:block}
  .topbar{
    position:sticky;top:0;z-index:30;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
    background:rgba(255,255,255,.94);backdrop-filter:blur(12px);
  }
  .topbar h1{font-size:18px;font-weight:700}
  .topbar .crumb{display:none}
  .top-actions{display:none}
  .wrap{padding:14px 14px calc(100px + env(safe-area-inset-bottom));max-width:none}
  .card{border-radius:16px}
  .card-h{padding:14px 16px 0;flex-direction:column;align-items:flex-start;gap:3px}
  .card-h h2{font-size:15px;width:100%}
  .card-h .sub{line-height:1.6}
  .card-h .sp{margin-left:0}
  .pad{padding:14px 16px 16px}
  .kpis{grid-template-columns:repeat(2,1fr);gap:10px}
  .btn{padding:9px 13px;font-size:14px;border-radius:11px;min-height:38px}
  .btn.sm{padding:7px 10px;font-size:13px;min-height:32px}
  input,select,textarea{font-size:16px !important}
  .skill{padding:13px 14px;gap:10px;background:#fff;border-bottom:1px solid var(--line-2)}
  .skill:hover{background:#fff}
  .skill .name{font-size:15px}
  .skill .desc{font-size:13px;-webkit-line-clamp:3}
  .skill .meta{font-size:12px}
  .skill .acts{width:100%;justify-content:flex-end;gap:2px;border-top:1px dashed var(--line-2);padding-top:8px;margin-top:2px}
  .skill-list{background:#fff;border-radius:16px;overflow:hidden;border:1px solid var(--line)}
  .app-tip{display:block}
  .sheet{
    left:0;right:0;top:auto;bottom:0;width:100%;height:calc(100vh - 46px - env(safe-area-inset-top));
    border-radius:18px 18px 0 0;transform:translateY(102%);
  }
  .sheet.on{transform:none}
  .sheet-h{padding:16px 16px 12px}
  .sheet-b{padding:16px 16px calc(26px + env(safe-area-inset-bottom))}
  body.sheet-open .tabbar,body.sheet-open .fab{display:none}
  body.sheet-open{overflow:hidden}
  .toolbar{padding:12px 14px;gap:8px}
  .search{padding:10px 12px;border-radius:12px}
  .fstrip{display:flex;gap:8px;overflow-x:auto;flex:1 1 100%;padding-bottom:2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .fstrip::-webkit-scrollbar{display:none}
  .fstrip .sel{flex:0 0 auto;padding:8px 10px;font-size:13px}
  .batch{padding:8px 14px;gap:6px;font-size:12.5px}
  .batch .btn.sm{padding:6px 9px}
  #toasts{bottom:calc(150px + env(safe-area-inset-bottom));width:calc(100% - 32px);left:16px;transform:none;align-items:stretch}
  .toast{text-align:center}
  .tabbar{
    display:grid;position:fixed;left:0;right:0;bottom:0;z-index:60;
    grid-template-columns:repeat(5,1fr);gap:2px;
    background:rgba(255,255,255,.97);backdrop-filter:blur(12px);border-top:1px solid var(--line);
    padding:6px 6px calc(6px + env(safe-area-inset-bottom));
  }
  .tabbar button{
    background:none;border:0;border-radius:12px;display:flex;flex-direction:column;align-items:center;
    gap:3px;padding:6px 2px 4px;color:#94a3b8;font-size:11.5px;letter-spacing:.2px;
  }
  .tabbar button.active{color:var(--accent);background:var(--accent-soft);font-weight:650}
  .tabbar .t-ico{font-size:19px;line-height:1.1;opacity:.9}
  .tabbar .t-txt{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fab.show{
    display:grid;place-items:center;position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));
    z-index:61;width:54px;height:54px;border-radius:50%;border:0;background:var(--accent);color:#fff;
    font-size:26px;line-height:1;box-shadow:0 8px 20px rgba(15,118,110,.35);
  }
  .fab:active{transform:scale(.96)}
}
@media (max-width:380px){
  .tabbar .t-txt{font-size:10.5px}
  .wrap{padding-left:10px;padding-right:10px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="brand-mark">SL</div>
      <div class="brand-txt"><strong>SkillLens</strong><span>我的常用 Skill 记录本</span></div>
    </div>
    <nav class="nav" id="nav">
      <button class="nav-item" data-view="dashboard"><span class="n-ico">◱</span><span>总览看板</span></button>
      <button class="nav-item" data-view="skills"><span class="n-ico">☰</span><span>Skill 库</span><span class="n-badge" id="badgeTotal"></span></button>
      <button class="nav-item" data-view="categories"><span class="n-ico">◈</span><span>分类体系</span><span class="n-badge" id="badgeCats"></span></button>
      <button class="nav-item" data-view="data"><span class="n-ico">⇅</span><span>导入 / 导出</span></button>
      <button class="nav-item" data-view="sync"><span class="n-ico">☁</span><span>云同步</span><span class="n-badge" id="badgeSync"></span></button>
    </nav>
    <div class="side-foot">
      数据保存在本浏览器<br>localStorage，不会上传
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <h1 id="pageTitle">总览看板</h1>
        <div class="crumb" id="pageCrumb">分类分布、覆盖情况与使用情况</div>
      </div>
      <div class="top-actions">
        <button class="btn" id="btnScan">⇪ 扫描 skill 目录</button>
        <button class="btn" id="btnAdd">＋ 新增 Skill</button>
        <button class="btn primary" id="btnExport">导出 JSON</button>
      </div>
    </header>
    <div class="wrap" id="viewRoot"></div>
  </main>
</div>

<div class="tabbar" id="tabbar"></div>
<button class="fab" id="fabAdd" aria-label="新增 Skill">＋</button>

<div class="overlay" id="overlay"></div>

<aside class="sheet" id="sheet">
  <div class="sheet-h">
    <div>
      <h3 id="sheetTitle">Skill 详情</h3>
      <div class="small muted" id="sheetSub"></div>
    </div>
    <button class="btn sm close" id="sheetClose">关闭</button>
  </div>
  <div class="sheet-b" id="sheetBody"></div>
</aside>

<div id="toasts"></div>
<input type="file" id="fileInput" accept=".json,.csv,.md,.txt" style="display:none" multiple>
<input type="file" id="dirInput" webkitdirectory directory multiple style="display:none">

<script>
/* ================= 规则表：分类与标签 ================= */

function uid(p){ return p + Math.random().toString(36).slice(2,8) + Date.now().toString(36).slice(-3); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function norm(s){ return String(s||"").toLowerCase(); }

function catOf(id){ return state.cats.find(c=>c.id===id) || state.cats[state.cats.length-1]; }

/* 分类器：name 命中权重 3，description 命中权重 1 */
function classify(name, desc){
  const n = norm(name), d = norm(desc);
  const scores = {};
  state.cats.forEach(c=>{ scores[c.id]=0; });
  state.cats.forEach(c=>{
    if(!c.kw || !c.kw.length) return;
    c.kw.forEach(k=>{
      const kk = norm(k);
      if(!kk) return;
      const strong = (c.strong||[]).some(x=>norm(x)===kk);
      const wName = strong ? 10 : 4, wDesc = strong ? 4 : 2;
      if(n.includes(kk)) scores[c.id] += wName;
      const hits = Math.min(d.split(kk).length - 1, 2);
      if(hits > 0) scores[c.id] += hits * wDesc;
    });
  });
  let best = "other", bv = 0;
  state.cats.forEach(c=>{
    if(c.id==="other") return;
    if(scores[c.id] > bv){ bv = scores[c.id]; best = c.id; }
  });
  return { cat: bv>0 ? best : "other", score: bv };
}

function autoTags(name, desc, limit){
  const n = norm(name), d = norm(desc);
  const out = [];
  TAG_DEFS.forEach(t=>{
    if(t.kw.some(k=>n.includes(norm(k)) || d.includes(norm(k)))) out.push(t.tag);
  });
  return out.slice(0, limit||4);
}

function makeSkill(o){
  const name = o.name || "未命名 Skill";
  const desc = o.desc || "";
  const auto = classify(name, desc);
  return {
    id: o.id || uid("s_"),
    name, desc,
    path: o.path || "",
    source: o.source || "manual",
    category: o.category || auto.cat,
    manual: !!o.manual,
    tags: o.tags || autoTags(name, desc),
    enabled: o.enabled !== false,
    rating: o.rating || 0,
    note: o.note || "",
    usage: o.usage || 0,
    favorite: !!o.favorite,
    logs: Array.isArray(o.logs) ? o.logs : [],
    lastUsed: o.lastUsed || null,
    createdAt: o.createdAt || new Date().toISOString()
  };
}

function ensureCat(id){
  if(state.cats.some(c=>c.id===id)) return;
  const def = CAT_DEFS.find(c=>c.id===id);
  if(!def) return;
  const item = Object.assign({}, def, {kw:(def.kw||[]).slice(), strong:(def.strong||[]).slice()});
  const oi = state.cats.findIndex(c=>c.id==="other");
  if(oi >= 0) state.cats.splice(oi, 0, item); else state.cats.push(item);
}
function migrateCats(){
  const dev = state.cats.find(c=>c.id==="dev");
  if(dev && dev.name === "研发与工程") dev.name = "编程";
  ["video","insight"].forEach(ensureCat);
  state.skills.forEach(s=>{
    if(/^ffmpeg/i.test(s.name)) s.category = "video";
    else if(/^last30days/i.test(s.name)) s.category = "insight";
  });
}
function loadState(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){
      const d = JSON.parse(raw);
      if(d && Array.isArray(d.skills) && d.skills.length){
        state.skills = d.skills;
        if(Array.isArray(d.cats) && d.cats.length) state.cats = d.cats;
        state.savedAt = d.savedAt || null;
        migrateCats();
        state._hash = JSON.stringify({ s: state.skills, c: state.cats });
        return;
      }
    }
  }catch(e){ console.warn("读取本地数据失败", e); }
  state.skills = SEED.map(s=>makeSkill(s));
  migrateCats();
  state.isSeed = false;
  state.savedAt = new Date().toISOString();
  try{ localStorage.setItem(LS_KEY, JSON.stringify({ skills: state.skills, cats: state.cats, savedAt: state.savedAt })); }catch(e){}
  state._hash = JSON.stringify({ s: state.skills, c: state.cats });
}
function saveState(){
  state.isSeed = false;
  state.savedAt = new Date().toISOString();
  try{
    localStorage.setItem(LS_KEY, JSON.stringify({ skills: state.skills, cats: state.cats, savedAt: state.savedAt }));
  }catch(e){ toast("本地保存失败：存储空间可能已满"); }
  schedulePush();
}

let toastTimer = null;
function toast(msg){
  const box = document.getElementById("toasts");
  const el = document.createElement("div");
  el.className = "toast"; el.textContent = msg;
  box.appendChild(el);
  setTimeout(()=>{ el.style.opacity="0"; el.style.transition=".3s"; setTimeout(()=>el.remove(),320); }, 2600);
}
function fmtDate(iso){
  if(!iso) return "—";
  const d = new Date(iso);
  if(isNaN(d)) return "—";
  const p = x=>String(x).padStart(2,"0");
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes());
}
function copyText(t){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(()=>toast("已复制到剪贴板"), ()=>toast("复制失败，请手动选择"));
  } else {
    const ta = document.createElement("textarea"); ta.value = t; document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); toast("已复制到剪贴板"); }catch(e){ toast("复制失败"); }
    ta.remove();
  }
}

  if(tc) tc.onclick = ()=>{ try{ localStorage.setItem("skilllens.tip","off"); }catch(e){} render(); };
  const bs = document.getElementById("badgeSync");
  if(bs) bs.textContent = syncBadge();
  if(v!=="skills") state.ui.selected = [];
  const h = JSON.stringify({ s: state.skills, c: state.cats });
  if(h !== state._hash){ state._hash = h; saveState(); }
}

function stats(){
  const total = state.skills.length;
  const enabled = state.skills.filter(s=>s.enabled).length;
  const manual = state.skills.filter(s=>s.manual).length;
  const other = state.skills.filter(s=>s.category==="other").length;
  const usage = state.skills.reduce((a,s)=>a+(s.usage||0),0);
  const usedCats = new Set(state.skills.map(s=>s.category)).size;
  const tags = {};
  state.skills.forEach(s=>(s.tags||[]).forEach(t=>{ tags[t]=(tags[t]||0)+1; }));
  const sources = {};
  state.skills.forEach(s=>{ sources[s.source]=(sources[s.source]||0)+1; });
  const favorite = state.skills.filter(s=>s.favorite).length;
  const logCount = state.skills.reduce((a,s)=>a+((s.logs||[]).length),0);
  return {total, enabled, manual, other, usage, usedCats, tags, sources, favorite, logCount};
}

/* 相似度：描述字符二元组 Jaccard */
function grams(s){
  const t = String(s||"").replace(/[\s\p{P}]/gu,"").toLowerCase();
  const g=[]; for(let i=0;i<t.length-1;i++) g.push(t.slice(i,i+2));
  return new Set(g);
}
function findSimilar(){
  const pairs = [];
  const arr = state.skills.filter(s=>s.desc && s.desc.length>12);
  for(let i=0;i<arr.length;i++){
    const ga = grams(arr[i].desc);
    if(!ga.size) continue;
    for(let j=i+1;j<arr.length;j++){
      const gb = grams(arr[j].desc); if(!gb.size) continue;
      let inter=0; ga.forEach(x=>{ if(gb.has(x)) inter++; });
      const uni = ga.size + gb.size - inter;
      const sc = uni? inter/uni : 0;
      if(sc>=0.55) pairs.push({a:arr[i], b:arr[j], score:sc});
    }
  }
  return pairs.sort((x,y)=>y.score-x.score).slice(0,8);
}

/* ================= Skill 库 ================= */
function filteredSkills(){
  const u = state.ui, q = norm(u.q).trim();
  let list = state.skills.filter(s=>{
    if(u.cat!=="all" && s.category!==u.cat) return false;
    if(u.src!=="all" && s.source!==u.src) return false;
    if(u.status==="on" && !s.enabled) return false;
    if(u.status==="off" && s.enabled) return false;
    if(u.minStar && s.rating<u.minStar) return false;
    if(u.fav==="only" && !s.favorite) return false;
    if(u.tag!=="all" && !(s.tags||[]).includes(u.tag)) return false;
    if(q){
      const hay = norm(s.name+" "+s.desc+" "+(s.tags||[]).join(" ")+" "+s.note+" "+s.path);
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  const sorters = {
    name:(a,b)=>a.name.localeCompare(b.name),
    usage:(a,b)=>b.usage-a.usage,
    rating:(a,b)=>b.rating-a.rating,
    cat:(a,b)=>catOf(a.category).name.localeCompare(catOf(b.category).name) || a.name.localeCompare(b.name),
    recent:(a,b)=>new Date(b.lastUsed||0)-new Date(a.lastUsed||0),
    added:(a,b)=>new Date(b.createdAt)-new Date(a.createdAt)
  };
  return list.sort(sorters[u.sort]||sorters.name);
}

function starsHTML(n, size){
  let s=""; for(let i=1;i<=5;i++) s += `<span style="${i<=n?"":"opacity:.25"}">★</span>`;

}
function shortDesc(d){
  const t = String(d||"").replace(/\s+/g," ").trim();

  return t.length > 110 ? t.slice(0,110) + "…" : t;
}

/* ================= 解析与导入 ================= */
function parseFrontmatter(text){
  const t = String(text||"").replace(/\r/g,"");
  if(!t.startsWith("---")) return null;
  const end = t.indexOf("\n---", 3);
  if(end<0) return null;
  const fm = t.slice(3, end).split("\n");
  const kv = {}; let cur = null;
  fm.forEach(line=>{
    const m = line.match(/^([A-Za-z_][A-Za-z0-9_-]*):\s*(.*)$/);
    if(m){ cur = m[1]; kv[cur] = m[2]; }
    else if(cur && line.trim()){ kv[cur] = (kv[cur] + " " + line.trim()).trim(); }
  });
  let desc = (kv.description||"").replace(/^[>|]\s?-?\s*/,"").replace(/^["']|["']$/g,"").trim();
  if(!kv.name && !desc) return null;
  return { name: (kv.name||"").trim().replace(/^["']|["']$/g,""), desc: desc };
}

function mergeSkills(items, source){
  let added = 0, updated = 0;
  items.forEach(it=>{
    if(!it || !it.name) return;
    const exist = state.skills.find(s=>s.name===it.name);
    if(exist){
      if(it.desc && it.desc!==exist.desc){ exist.desc = it.desc; updated++; }
      if(it.path) exist.path = it.path;
    } else {
      state.skills.push(makeSkill({name:it.name, desc:it.desc, path:it.path, source: source||"import"}));
      added++;
    }
  });
  return {added, updated};
}

async function scanFiles(fileList){
  const files = Array.from(fileList).filter(f=>/SKILL\.md$/i.test(f.name));
  if(!files.length){ toast("没有找到 SKILL.md 文件"); return; }
  const items = [];
  for(const f of files){
    try{
      const text = await f.text();
      const fm = parseFrontmatter(text);
      if(fm && fm.name){
        const rel = (f.webkitRelativePath||f.name).split("/");
        items.push({ name: fm.name, desc: fm.desc, path: rel.join("/") });
      }
    }catch(e){}
  }
  const r = mergeSkills(items, "import");
  render();
  toast(`扫描 ${files.length} 个 SKILL.md：新增 ${r.added}，更新 ${r.updated}`);
}

function toCSV(){
  const head = ["name","category","category_name","tags","source","enabled","favorite","rating","usage","lastUsed","note","path","desc"];
  const q = v=>`"${String(v==null?"":v).replace(/"/g,'""')}"`;
  const rows = state.skills.map(s=>[
    s.name, s.category, catOf(s.category).name, (s.tags||[]).join("|"), s.source,
    s.enabled?1:0, s.favorite?1:0, s.rating, s.usage, s.lastUsed||"", s.note, s.path, s.desc
  ].map(q).join(","));
  return "\ufeff" + head.join(",") + "\n" + rows.join("\n");
}
function fromCSV(text){
  const rows = [];
  let row = [], cell = "", inQ = false;
  const t = text.replace(/\ufeff/g,"").replace(/\r/g,"");
  for(let i=0;i<t.length;i++){
    const ch = t[i];
    if(inQ){
      if(ch === '"' && t[i+1] === '"'){ cell += '"'; i++; }
      else if(ch === '"') inQ = false;
      else cell += ch;
    } else {
      if(ch === '"') inQ = true;
      else if(ch === ","){ row.push(cell); cell=""; }
      else if(ch === "\n"){ row.push(cell); rows.push(row); row=[]; cell=""; }
      else cell += ch;
    }
  }
  if(cell.length || row.length){ row.push(cell); rows.push(row); }
  if(!rows.length) return [];
  const head = rows.shift().map(h=>h.trim());
  return rows.filter(r=>r.some(x=>x.trim())).map(r=>{
    const o = {}; head.forEach((h,i)=>o[h]= (r[i]||""));
    return {
      name:o.name, desc:o.desc, path:o.path,
      category:o.category||undefined,
      manual: !!o.category,
      tags: o.tags? o.tags.split("|").map(x=>x.trim()).filter(Boolean): undefined,
      enabled: o.enabled? o.enabled!=="0" : true,
      favorite: o.favorite==="1" || o.favorite==="true",
      rating: +o.rating || 0, usage: +o.usage || 0, lastUsed: o.lastUsed || null,
      note:o.note || ""
    };
  });
}

function download(name, text, type){
  const blob = new Blob([text], {type: type||"text/plain;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}
function exportJSON(){
  const payload = { app:"SkillLens", version:1, exportedAt:new Date().toISOString(), cats:state.cats, skills:state.skills };
  download("skills-"+new Date().toISOString().slice(0,10)+".json", JSON.stringify(payload, null, 2), "application/json");
  toast("已导出 JSON");
}
function exportCSV(){
  download("skills-"+new Date().toISOString().slice(0,10)+".csv", toCSV(), "text/csv;charset=utf-8");
  toast("已导出 CSV");
}
function importJSON(text){
  let d;
  try{ d = JSON.parse(text); }catch(e){ toast("JSON 解析失败"); return; }
  let skills = [], cats = null;
  if(Array.isArray(d)) skills = d;
  else if(d && Array.isArray(d.skills)){ skills = d.skills; cats = d.cats||null; }
  else { toast("未识别的 JSON 结构"); return; }
  if(cats && Array.isArray(cats) && cats.length) state.cats = cats;
  const exist = new Map(state.skills.map(s=>[s.name, s]));
  let added=0, updated=0;
  skills.forEach(it=>{
    if(!it || !it.name) return;
    const e = exist.get(it.name);
    if(e){
      ["desc","path","category","tags","enabled","favorite","rating","note","usage","logs","lastUsed","manual","source"].forEach(k=>{
        if(it[k]!==undefined) e[k]=it[k];
      });
      updated++;
    } else {
      state.skills.push(makeSkill(it)); added++;
    }
  });
  render();
  toast(`导入完成：新增 ${added}，更新 ${updated}`);
}

/* ================= 批量与事件 ================= */
function batchAction(kind){
  const ids = state.ui.selected;
  if(!ids.length) return;
  if(kind==="del"){
    if(!confirm(`确定删除选中的 ${ids.length} 个 Skill？`)) return;
    state.skills = state.skills.filter(s=>!ids.includes(s.id));
    state.ui.selected = []; render(); toast("已删除选中项"); return;
  }
  state.skills.forEach(s=>{ if(ids.includes(s.id)) s.enabled = kind==="on"; });
  render(); toast(kind==="on"?"已启用选中项":"已停用选中项");
}
function recalcAll(includeManual){
  let n = 0;
  state.skills.forEach(s=>{
    if(s.manual && !includeManual) return;
    const c = classify(s.name, s.desc);
    s.category = c.cat;
    if(includeManual) s.manual = false;
    n++;
  });
  render(); toast(`已重新归类 ${n} 个 Skill`);
}

function toggleCat(id){
  state.ui.cat = state.ui.cat===id ? "all" : id;
  state.ui.view = "skills"; render();
}

document.addEventListener("click", e=>{
  const t = e.target;
  const openEl = t.closest("[data-open]");
  if(openEl){ openSheet(openEl.dataset.open); return; }
  const favEl = t.closest("[data-fav]");
  if(favEl){
    const s = state.skills.find(x=>x.id===favEl.dataset.fav);
    if(s){ s.favorite = !s.favorite; saveState(); render(); toast(s.favorite? "已收藏 "+s.name : "已取消收藏"); }
    return;
  }
  const useEl = t.closest("[data-use]");
  if(useEl){
    const s = state.skills.find(x=>x.id===useEl.dataset.use);
    if(s){ s.usage++; s.lastUsed = new Date().toISOString(); (s.logs=s.logs||[]).unshift({t:s.lastUsed, note:""}); saveState(); render(); toast(s.name+" 使用 +1"); }
    return;
  }
  const starEl = t.closest("[data-star]");
  if(starEl){
    const s = state.skills.find(x=>x.id===starEl.dataset.star);
    if(s){ s.rating = Math.min(5, (s.rating||0)+1); saveState(); render(); toast("评分："+s.rating+" 星"); }
    return;
  }
  const tgEl = t.closest("[data-toggle]");
  if(tgEl){
    const s = state.skills.find(x=>x.id===tgEl.dataset.toggle);
    if(s){ s.enabled = !s.enabled; saveState(); render(); }
    return;
  }
  const jc = t.closest("[data-jumpcat]");
  if(jc){ toggleCat(jc.dataset.jumpcat); return; }
  const jt = t.closest("[data-jumptag]");
  if(jt){ state.ui.tag = jt.dataset.jumptag; state.ui.cat="all"; state.ui.view="skills"; render(); return; }
  const b = t.closest("[data-batch]");
  if(b){ batchAction(b.dataset.batch); return; }
  const rc = t.closest("[data-reclass]");
  if(rc){
    if(rc.dataset.reclass==="all" && !confirm("会覆盖所有人工分类，继续？")) return;
    recalcAll(rc.dataset.reclass==="all"); return;
  }
  const dc = t.closest("[data-delcat]");
  if(dc){
    const id = dc.dataset.delcat;
    if(!confirm("删除该分类？其下 Skill 将被移到“其他”。")) return;
    state.skills.forEach(s=>{ if(s.category===id) s.category = "other"; });
    state.cats = state.cats.filter(c=>c.id!==id);
    render(); toast("分类已删除"); return;
  }
  const ac = t.closest("[data-addcat]");
  if(ac){
    const name = prompt("新分类名称：");
    if(!name) return;
    const id = "c_"+Math.random().toString(36).slice(2,7);
    state.cats.splice(state.cats.length-1, 0, {id, name:name.trim(), color:"#475569", kw:[]});
    render(); toast("已新增分类"); return;
  }
  const cat = t.closest("[data-catalog]");
  if(cat){ importSiteCatalog(); return; }
  const ghi = t.closest("[data-ghimport]");
  if(ghi){
    const box = document.getElementById("ghUrl");
    const v = box ? box.value.trim() : "";
    if(!v){ toast("先粘贴一个 GitHub 链接"); return; }
    importFromGithub(v);
    return;
  }
  const gh = t.closest("[data-gh]");
  if(gh){
    const act = gh.dataset.gh;
    const tk = document.getElementById("sToken"), gi = document.getElementById("sGist"), au = document.getElementById("sAuto");
    if(tk) syncCfg.token = tk.value.trim();
    if(gi) syncCfg.gist = gi.value.trim().replace(/.*gist\.github\.com\/(?:[^/]+\/)?/,"").replace(/#.*$/,"");
    if(au) syncCfg.auto = au.checked;
    if(act==="save"){
      saveSyncCfg(); render(); toast(syncReady()? "配置已保存，正在同步…" : "配置已保存");
      if(syncReady() && syncCfg.auto) pullRemote(false);
      return;
    }
    if(act==="sync"){ saveSyncCfg(); syncNow(); return; }
    if(act==="pull"){ saveSyncCfg(); pullRemote(true); return; }
    if(act==="push"){
      saveSyncCfg();
      if(!syncReady()){ toast("先填 Token 和 Gist ID"); return; }
      if(!confirm("用本地数据覆盖云端？")) return;
      pushRemote(true); return;
    }
    if(act==="creategist"){ saveSyncCfg(); createGist(); return; }
    if(act==="clear"){
      if(!confirm("清除本机的同步配置？云端 Gist 不会被删除。")) return;
      syncCfg = { token:"", gist:"", auto:true, lastSync:null, remoteSavedAt:null, lastError:"" };
      saveSyncCfg(); render(); toast("已清除同步配置"); return;
    }
    return;
  }
  const im = t.closest("[data-imp]");
  if(im){
    const kind = im.dataset.imp;
    if(kind==="md"){
      const el = document.getElementById("pasteMd");
      if(el){ el.scrollIntoView({block:"center"}); el.focus(); }
      return;
    }
    document.getElementById("fileInput").dataset.mode = kind;
    document.getElementById("fileInput").click(); return;
  }
  const ex = t.closest("[data-exp]");
  if(ex){ ex.dataset.exp==="csv"? exportCSV() : exportJSON(); return; }
  const rs = t.closest("[data-reset]");
  if(rs){
    if(rs.dataset.reset==="clear"){
      if(!confirm("清空全部数据？建议先导出备份。")) return;
      state.skills = []; state.cats = CAT_DEFS.map(c=>({...c})); render(); toast("已清空");
    } else if(rs.dataset.reset==="empty"){
      if(!confirm("清空所有 Skill？分类体系与同步配置保留，此操作不可撤销。")) return;
      state.skills = []; state.ui.selected = []; render();
      if(syncReady() && confirm("同时把云端也清空？其他设备同步后也会变空。")) pushRemote(true);
      else toast("已清空全部 Skill");
      return;
    } else if(rs.dataset.reset==="keepfav"){
      const keep = state.skills.filter(s=>s.favorite);
      if(!keep.length){ toast("还没有收藏项，先点 ♥ 收藏几个"); return; }
      if(!confirm(`只保留 ${keep.length} 个收藏项，其余全部删除？`)) return;
      state.skills = keep; state.ui.selected = []; render(); toast(`已保留 ${keep.length} 个收藏项`);
    } else {
      if(!confirm("用内置种子数据覆盖当前数据？")) return;
      state.cats = CAT_DEFS.map(c=>({...c}));
      state.skills = SEED.map(x=>makeSkill(x));
      render(); toast("已恢复种子数据");
    }
    return;
  }
  const dd = t.closest("#dropDir");
  if(dd){ document.getElementById("dirInput").click(); return; }
});

/* ================= GitHub 链接解析导入 ================= */
function ghHeaders(extra){
  const h = Object.assign({ "Accept": "application/vnd.github+json" }, extra||{});
  if(syncCfg && syncCfg.token) h["Authorization"] = "Bearer " + syncCfg.token;
  return h;
}
async function ghJson(url){
  const res = await fetch(url, { headers: ghHeaders() });
  if(!res.ok){
    let msg = "";
    try{ const j = await res.json(); msg = j.message || ""; }catch(e){}
    if(res.status === 403 && /rate limit/i.test(msg)){
      throw new Error("GitHub 接口限流（匿名每小时 60 次）。到「云同步」填一个 Token 再重试，或直接粘贴单个 SKILL.md 的 raw 链接。");
    }
    throw new Error("GitHub " + res.status + (msg? "：" + msg : ""));
  }
  return await res.json();
}
async function fetchText(url){
  const res = await fetch(url, { headers: syncCfg && syncCfg.token ? { "Authorization": "Bearer " + syncCfg.token } : {} });
  if(!res.ok) throw new Error("读取文件失败 HTTP " + res.status);
  return await res.text();
}
function parseGithubUrl(input){
  let u = String(input||"").trim().replace(/\s+/g,"").replace(/\/+$/,"").replace(/\.git$/,"");
  let m;
  // raw 文件
  m = u.match(/^https?:\/\/raw\.githubusercontent\.com\/([^/]+)\/([^/]+)\/([^/]+)\/(.+)$/);
  if(m) return { type:"file", owner:m[1], repo:m[2], branch:m[3], path:m[4] };
  // gist
  m = u.match(/^https?:\/\/gist\.github\.com\/(?:[^/]+\/)?([0-9a-f]+)$/i);
  if(m) return { type:"gist", id:m[1] };
  // blob
  m = u.match(/^https?:\/\/github\.com\/([^/]+)\/([^/]+)\/blob\/([^/]+)\/(.+)$/);
  if(m) return { type:"file", owner:m[1], repo:m[2], branch:m[3], path:m[4] };
  // tree
  m = u.match(/^https?:\/\/github\.com\/([^/]+)\/([^/]+)\/tree\/([^/]+)(?:\/(.+))?$/);
  if(m) return { type:"repo", owner:m[1], repo:m[2], branch:m[3], sub:m[4]||"" };
  // repo root
  m = u.match(/^https?:\/\/github\.com\/([^/]+)\/([^/]+)$/);
  if(m) return { type:"repo", owner:m[1], repo:m[2], branch:"", sub:"" };
  // owner/repo 简写
  m = u.match(/^([A-Za-z0-9_.-]+)\/([A-Za-z0-9_.-]+)$/);
  if(m) return { type:"repo", owner:m[1], repo:m[2], branch:"", sub:"" };
  return null;
}
async function importSiteCatalog(){
  const setR = (html)=>{ state.ui.catResult = html; const el=document.getElementById("catResult"); if(el) el.innerHTML=html; };
  setR("正在读取本站技能库…");
  try{
    const res = await fetch("./skills/index.json", { cache:"no-store" });
    if(!res.ok) throw new Error("没找到 skills/index.json（HTTP " + res.status + "）");
    const d = await res.json();
    const list = Array.isArray(d) ? d : (d.skills || []);
    const items = list.filter(x=>x && x.name).map(x=>({
      name:x.name, desc:x.desc || x.description || "",
      category:x.category || null, manual:!!x.category,
      tags:x.tags || null, source:"import",
      path:x.path || ("skills/" + x.name),
      note:x.note || "",
      favorite:!!x.favorite
    }));
    const r = addGithubItems(items);
    const names = items.slice(0,24).map(x=>x.name);
    state.ui.catResult = `已从本站加载 ${items.length} 个技能：<b style="color:var(--accent)">新增 ${r.added}</b>，跳过重复 ${r.skipped}。`
      + (names.length? `<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px">${names.map(n=>`<span class="chip mono">${esc(n)}</span>`).join("")}</div>`:"");
    render(); toast("本站技能库导入完成：新增 " + r.added);
  }catch(e){
    setR('<span style="color:var(--danger)">读取失败：' + esc(e.message) + '。本地打开或离线时请改用「导入 JSON」。</span>');
    toast("读取失败：" + e.message);
  }
}
function addGithubItems(items){
  let added = 0, skipped = 0;
  items.forEach(it=>{
    if(!it || !it.name) return;
    if(state.skills.some(s=>s.name===it.name)){ skipped++; return; }
    state.skills.push(makeSkill(it)); added++;
  });
  return { added, skipped };
}
function setGhResult(html){
  state.ui.ghResult = html;
  const el = document.getElementById("ghResult");
  if(el) el.innerHTML = html;
}
async function importFromGithub(rawUrl){
  state.ui.ghUrl = rawUrl;
  const info = parseGithubUrl(rawUrl);
  if(!info){
    setGhResult('<span style="color:var(--danger)">链接格式没认出来。支持 github.com/owner/repo、/tree/branch/子目录、/blob/branch/文件、raw.githubusercontent.com、gist.github.com。</span>');
    return;
  }
  setGhResult("正在解析…");
  syncCfg && (syncCfg.lastError = "");
  try{
    let items = [];
    let label = "";
    if(info.type === "file"){
      const text = await fetchText("https://raw.githubusercontent.com/" + info.owner + "/" + info.repo + "/" + info.branch + "/" + info.path);
      const fm = parseFrontmatter(text);
      if(!fm) throw new Error("这个文件没有有效的 frontmatter");
      const folder = info.path.split("/").slice(-2)[0] || info.path;
      items.push({ name: fm.name || folder, desc: fm.desc, source:"github",
                   path: "github.com/" + info.owner + "/" + info.repo + "/" + info.path });
      label = info.owner + "/" + info.repo;
    } else if(info.type === "gist"){
      const g = await ghJson("https://api.github.com/gists/" + info.id);
      Object.keys(g.files||{}).forEach(k=>{
        if(!/\.md$/i.test(k)) return;
        const fm = parseFrontmatter(g.files[k].content || "");
        if(!fm) return;
        items.push({ name: fm.name || k.replace(/\.md$/i,""), desc: fm.desc, source:"github",
                     path: "gist.github.com/" + info.id + "/" + k });
      });
      label = "Gist " + info.id.slice(0,8);
    } else {
      let branch = info.branch;
      if(!branch){
        const repoInfo = await ghJson("https://api.github.com/repos/" + info.owner + "/" + info.repo);
        branch = repoInfo.default_branch || "main";
      }
      const tree = await ghJson("https://api.github.com/repos/" + info.owner + "/" + info.repo + "/git/trees/" + encodeURIComponent(branch) + "?recursive=1");
      const prefix = info.sub ? info.sub.replace(/^\/|\/$/g,"") + "/" : "";
      const files = (tree.tree||[]).filter(t => t.type === "blob" && /SKILL\.md$/i.test(t.path) && t.path.startsWith(prefix)).slice(0, 300);
      if(!files.length) throw new Error("这个仓库（或子目录）里没找到 SKILL.md");
      setGhResult("找到 " + files.length + " 个 SKILL.md，正在读取…");
      const results = [];
      const batch = 6;
      for(let i=0;i<files.length;i+=batch){
        const slice = files.slice(i, i+batch);
        const got = await Promise.all(slice.map(async f=>{
          try{
            const text = await fetchText("https://raw.githubusercontent.com/" + info.owner + "/" + info.repo + "/" + branch + "/" + f.path);
            const fm = parseFrontmatter(text);
            if(!fm) return null;
            const folder = f.path.split("/").slice(-2)[0] || f.path;
            return { name: fm.name || folder, desc: fm.desc, source:"github",
                     path: "github.com/" + info.owner + "/" + info.repo + "/" + f.path };
          }catch(e){ return null; }
        }));
        got.forEach(x=>{ if(x) results.push(x); });
        setGhResult("读取中… " + Math.min(i+batch, files.length) + " / " + files.length);
      }
      items = results;
      label = info.owner + "/" + info.repo + (info.sub? " · " + info.sub : "") + " (" + branch + ")";
    }
    const r = addGithubItems(items);
    const names = items.slice(0, 24).map(x=>x.name);
    state.ui.ghResult = `已从 <b>${esc(label)}</b> 解析 ${items.length} 个技能：<b style="color:var(--accent)">新增 ${r.added}</b>，跳过重复 ${r.skipped}。`
      + (names.length? `<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px">${names.map(n=>`<span class="chip mono">${esc(n)}</span>`).join("")}${items.length>24?`<span class="chip">+${items.length-24}</span>`:""}</div>`:"");
    render();
    toast("GitHub 导入完成：新增 " + r.added + " 个");
  }catch(e){
    setGhResult('<span style="color:var(--danger)">导入失败：' + esc(e.message) + '</span>');
    toast("导入失败：" + e.message);
  }
}

/* ================= 云同步：GitHub Gist ================= */
const SYNC_KEY = "skilllens.sync.v1";
const GH_API = "https://api.github.com";
const GH_FILE = "skilllens.json";
let syncCfg = { token:"", gist:"", auto:true, lastSync:null, remoteSavedAt:null, lastError:"" };
let pushTimer = null, syncing = false;

function loadSyncCfg(){
  try{
    const raw = localStorage.getItem(SYNC_KEY);
    if(raw) syncCfg = Object.assign(syncCfg, JSON.parse(raw));
  }catch(e){}
}
function saveSyncCfg(){
  try{ localStorage.setItem(SYNC_KEY, JSON.stringify(syncCfg)); }catch(e){}
}
function syncReady(){ return !!(syncCfg.token && syncCfg.gist); }
function syncPending(){ return !!(syncCfg.lastSync && state.savedAt && state.savedAt > syncCfg.lastSync); }
function syncBadge(){
  if(!syncCfg.token) return "未设置";
  if(!syncCfg.gist) return "待建库";
  if(syncing) return "同步中";
  if(syncPending()) return "待上传";
  return "已同步";
}
function syncPayload(){
  return { app:"SkillLens", version:2, savedAt: state.savedAt || new Date().toISOString(),
           device: (navigator.userAgentData && navigator.userAgentData.platform) || navigator.platform || "unknown",
           cats: state.cats, skills: state.skills };
}
async function ghApi(path, method, body){
  const res = await fetch(GH_API + path, {
    method: method || "GET",
    headers: {
      "Authorization": "Bearer " + syncCfg.token,
      "Accept": "application/vnd.github+json",
      "Content-Type": "application/json"
    },
    body: body ? JSON.stringify(body) : undefined
  });
  if(!res.ok){
    let msg = "";
    try{ const j = await res.json(); msg = j.message || ""; }catch(e){}
    throw new Error("GitHub " + res.status + (msg? "：" + msg : ""));
  }
  return await res.json();
}
async function createGist(){
  if(!syncCfg.token){ toast("请先填 GitHub Token"); return; }
  syncing = true; refreshSyncBadge();
  try{
    const d = await ghApi("/gists", "POST", {
      description: "SkillLens 个人技能库（私有同步）",
      public: false,
      files: { [GH_FILE]: { content: JSON.stringify(syncPayload(), null, 1) } }
    });
    syncCfg.gist = d.id;
    syncCfg.lastSync = new Date().toISOString();
    syncCfg.remoteSavedAt = state.savedAt;
    saveSyncCfg();
    toast("已创建私有 Gist：" + d.id.slice(0,8) + "…");
    render();
  }catch(e){ syncCfg.lastError = e.message; toast("创建失败：" + e.message); }
  syncing = false; refreshSyncBadge();
}
async function pushRemote(manual){
  if(!syncReady()){ if(manual) toast("先填 Token 并保存配置"); return; }
  syncing = true; refreshSyncBadge();
  try{
    await ghApi("/gists/" + syncCfg.gist, "PATCH", {
      description: "SkillLens 个人技能库（私有同步）",
      files: { [GH_FILE]: { content: JSON.stringify(syncPayload(), null, 1) } }
    });
    syncCfg.lastSync = new Date().toISOString();
    syncCfg.remoteSavedAt = state.savedAt;
    syncCfg.lastError = "";
    saveSyncCfg();
    if(manual) toast("已上传到云端");
    if(state.ui.view==="sync") render();
  }catch(e){
    syncCfg.lastError = e.message;
    toast("上传失败：" + e.message);
  }
  syncing = false; refreshSyncBadge();
}
async function fetchRemote(){
  if(!syncReady()) return null;
  const g = await ghApi("/gists/" + syncCfg.gist);
  const f = g.files && g.files[GH_FILE];
  if(!f) throw new Error("云端 Gist 里没有 " + GH_FILE);
  let content = f.content;
  if(f.truncated && f.raw_url){
    const r = await fetch(f.raw_url, { headers: { "Accept": "application/vnd.github.raw" } });
    content = await r.text();
  }
  return JSON.parse(content);
}
function applyRemote(d){
  state.skills = (d.skills||[]).map(x=>makeSkill(x));
  if(Array.isArray(d.cats) && d.cats.length) state.cats = d.cats;
  state.savedAt = d.savedAt || new Date().toISOString();
  state.isSeed = false;
  state._hash = JSON.stringify({ s: state.skills, c: state.cats });
  try{ localStorage.setItem(LS_KEY, JSON.stringify({ skills: state.skills, cats: state.cats, savedAt: state.savedAt })); }catch(e){}
  render();
}
async function pullRemote(manual){
  if(!syncReady()){ if(manual) toast("先填 Token 并保存配置"); return; }
  syncing = true; refreshSyncBadge();
  try{
    const d = await fetchRemote();
    const newer = state.isSeed || (d.savedAt||"") > (state.savedAt||"");
    if(!newer){
      if(manual) toast("云端不比本地新，无需拉取");
    } else {
      const localDirty = syncCfg.lastSync && state.savedAt && state.savedAt > syncCfg.lastSync;
      if(localDirty && manual){
        if(!confirm("云端更新（" + fmtDate(d.savedAt) + "），本地也有修改。\n确定用云端覆盖本地？")){ syncing=false; refreshSyncBadge(); return; }
        applyRemote(d); toast("已用云端数据覆盖本地");
      } else if(localDirty){
        toast("云端有更新，本地也有改动——请到云同步页手动选择");
      } else {
        applyRemote(d); toast(manual? "已拉取云端最新数据" : "已同步云端最新数据");
      }
    }
    syncCfg.lastSync = new Date().toISOString();
    syncCfg.remoteSavedAt = d.savedAt || null;
    saveSyncCfg();
  }catch(e){
    syncCfg.lastError = e.message;
    if(manual || !syncCfg.lastErrorShown){ toast("拉取失败：" + e.message); syncCfg.lastErrorShown = true; saveSyncCfg(); }
  }
  syncing = false; refreshSyncBadge();
  if(state.ui.view==="sync") render();
}
async function syncNow(){
  if(!syncReady()){ toast("先在下方填 Token 并保存配置"); return; }
  syncing = true; refreshSyncBadge();
  try{
    const d = await fetchRemote();
    const remoteNewer = (d.savedAt||"") > (state.savedAt||"");
    if(!remoteNewer){ await pushRemote(false); toast("已上传本地最新数据"); }
    else {
      const localDirty = syncCfg.lastSync && state.savedAt && state.savedAt > syncCfg.lastSync;
      if(localDirty){
        const useRemote = confirm("云端更新：" + fmtDate(d.savedAt) + "\n本地也改过：确定用云端覆盖本地？（取消=用本地覆盖云端）");
        if(useRemote){ applyRemote(d); syncCfg.lastSync = new Date().toISOString(); syncCfg.remoteSavedAt = d.savedAt; saveSyncCfg(); toast("已拉取云端"); }
        else { await pushRemote(false); toast("已用本地覆盖云端"); }
      } else {
        applyRemote(d); syncCfg.lastSync = new Date().toISOString(); syncCfg.remoteSavedAt = d.savedAt; saveSyncCfg(); toast("已拉取云端最新数据");
      }
    }
  }catch(e){ syncCfg.lastError = e.message; toast("同步失败：" + e.message); }
  syncing = false; refreshSyncBadge();
  render();
}
function schedulePush(){
  if(!syncCfg.auto || !syncReady() || state.isSeed) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(()=>{ pushRemote(false); }, 4000);
}
function refreshSyncBadge(){
  const b = document.getElementById("badgeSync");
  if(b) b.textContent = syncBadge();
}
function renderSync(){
  const tokenMasked = syncCfg.token ? syncCfg.token.slice(0,4) + "••••" + syncCfg.token.slice(-4) : "";
  return `
  <div class="grid" style="grid-template-columns:1.25fr 1fr">
    <section class="card">
      <div class="card-h"><h2>连接 GitHub Gist</h2><span class="sub">私有 Gist 当数据库，一次配置两端通用</span></div>
      <div class="pad">
        <div class="field">
          <label>GitHub Token（只需 gist 权限）</label>
          <input type="password" id="sToken" placeholder="ghp_… 或 github_pat_…" value="${esc(syncCfg.token)}">
          <div class="hint">在 GitHub → Settings → Developer settings → Personal access tokens 生成，勾选 <b>gist</b> 即可。Token 只存在本机浏览器，不会写进云端数据或导出文件。</div>
        </div>
        <div class="field">
          <label>Gist ID（已有库就填，没有就留空后点“创建”）</label>
          <div class="path-box">
            <input type="text" id="sGist" placeholder="例如 6f3a1c…（Gist 链接最后一段）" value="${esc(syncCfg.gist)}">
            <button class="btn sm" data-gh="creategist" style="white-space:nowrap">创建新库</button>

        </div>
        <div class="field row" style="gap:14px;flex-wrap:wrap">
          <label class="switch" style="margin:0"><input type="checkbox" id="sAuto" ${syncCfg.auto?"checked":""}> 自动同步（打开拉取、改动后 4 秒上传）</label>
        </div>
        <div class="row" style="gap:8px;flex-wrap:wrap;margin-top:6px">
          <button class="btn primary" data-gh="save">保存配置</button>
          <button class="btn" data-gh="sync">立即同步</button>
          <button class="btn" data-gh="pull">从云端拉取</button>
          <button class="btn" data-gh="push">覆盖上传</button>
          <button class="btn danger" data-gh="clear">清除配置</button>
        </div>
      </div>
    </section>

    <section class="card">
      <div class="card-h"><h2>同步状态</h2><span class="sub">${syncBadge()}</span></div>
      <div class="pad">
        <div class="kv">
          <div class="mini-stat"><div class="k">本地数据时间</div><div class="v" style="font-size:12px;font-weight:500">${fmtDate(state.savedAt)}</div></div>
          <div class="mini-stat"><div class="k">上次同步</div><div class="v" style="font-size:12px;font-weight:500">${fmtDate(syncCfg.lastSync)}</div></div>
          <div class="mini-stat"><div class="k">云端数据时间</div><div class="v" style="font-size:12px;font-weight:500">${fmtDate(syncCfg.remoteSavedAt)}</div></div>
          <div class="mini-stat"><div class="k">本机记录</div><div class="v">${state.skills.length}</div></div>
        </div>
        ${syncCfg.lastError? `<div class="small" style="margin-top:10px;color:var(--danger)">最近一次错误：${esc(syncCfg.lastError)}</div>`:""}
        <div class="small muted" style="margin-top:12px;line-height:1.8">
          · 首次使用：填 Token → 点“创建新库”（或填已有 Gist ID）→ 保存配置。<br>
          · 手机端同样操作一次即可，两端从此共用一份数据。<br>
          · 冲突策略：谁的时间更新以谁为准；两边都改过时会弹窗让你选择，不会静默覆盖。
        </div>
      </div>
    </section>
  </div>

  <section class="card" style="margin-top:14px">
    <div class="card-h"><h2>同步说明</h2></div>
    <div class="pad small" style="color:var(--ink-2);line-height:1.9">
      1. 数据以整份快照写入 Gist 的 <span class="mono">skilllens.json</span>，包含技能、分类、标签、收藏、评分、备注与使用记录。<br>
      2. 自动同步只会后台静默上传，遇到“云端更新且本地也改过”会提示你手动处理。<br>
      3. 建议用只勾 gist 权限的 Token；Token 泄露可随时在 GitHub 撤销。<br>
      4. Gist 是私有的，但请勿把 Token 发给他人；换电脑时导出 JSON 仍可作离线备份。

  </section>`;
}

/* ================= 初始化 ================= */
loadState();
loadSyncCfg();
render();
if(syncReady() && syncCfg.auto) setTimeout(()=>pullRemote(false), 700);
</script>

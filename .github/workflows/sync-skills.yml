name: Sync skills

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "skills/index.json"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch SKILL.md from upstream repos
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          data = json.load(open("skills/index.json", encoding="utf-8"))
          for s in data["skills"]:
              url = s.get("upstream")
              if not url:
                  continue
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "skillshub-sync"})
                  txt = urllib.request.urlopen(req, timeout=60).read().decode("utf-8")
              except Exception as e:
                  print("skip", s["name"], e)
                  continue
              d = os.path.join("skills", s["name"])
              os.makedirs(d, exist_ok=True)
              p = os.path.join(d, "SKILL.md")
              old = open(p, encoding="utf-8").read() if os.path.exists(p) else ""
              if old != txt:
                  open(p, "w", encoding="utf-8").write(txt)
                  print("updated", p, len(txt))
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A skills
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "chore: sync SKILL.md from upstream"
            git push
          fi

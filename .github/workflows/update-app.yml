name: Update SkillLens app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".deploy/index.html.patch.xz.b64"
      - "tools/apply_patch.py"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decode and apply patch
        run: |
          set -e
          test -f .deploy/index.html.patch.xz.b64
          base64 -d .deploy/index.html.patch.xz.b64 | xz -d > /tmp/update.patch
          head -3 /tmp/update.patch
          python3 tools/apply_patch.py
          grep -q 'data-catalog' index.html

      - name: Commit and drop payload
        run: |
          rm -rf .deploy
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(app): 导入页新增「本站技能库」一键导入"
          git push
